name: Build GhostLP APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract GhostLP project
        run: |
          unzip -o GhostLP_real_backend.zip
          echo "Project files:"
          ls -la
          echo "Flutter project:"
          ls -la lib
          cat pubspec.yaml

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare Android project
        run: |
          flutter create . \
            --platforms=android \
            --org com.ghostlp

          flutter pub get

      - name: Set GhostLP app name
        run: |
          sed -i 's/android:label="[^"]*"/android:label="GhostLP"/' \
            android/app/src/main/AndroidManifest.xml

      - name: Build GhostLP APK
        run: |
          flutter build apk --release

      - name: Publish GhostLP APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ghostlp-build-${{ github.run_number }}
          name: GhostLP build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
