name: Build GhostLP APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract GhostLP project
        run: |
          set -e
          unzip -o GhostLP_wallet_persistence_fixed.zip
          test -f pubspec.yaml
          test -d lib
          echo "Flutter project found."

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android platform
        run: |
          flutter create --platforms=android --org com.ghostlp .

      - name: Configure Android app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = s.replace('android:label="ghostlp"', 'android:label="GhostLP"')
          s = s.replace('android:label="Ghostlp"', 'android:label="GhostLP"')
          s = s.replace('android:label="Flutter Demo"', 'android:label="GhostLP"')
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<manifest ', '<manifest ', 1)
              marker = '>'
              idx = s.find(marker)
              s = s[:idx+1] + '\n    <uses-permission android:name="android.permission.INTERNET"/>' + s[idx+1:]
          p.write_text(s)

          gradle = Path('android/app/build.gradle.kts')
          if gradle.exists():
              s = gradle.read_text()
              s = s.replace('applicationId = "com.ghostlp.ghostlp"', 'applicationId = "com.ghostlp.app"')
              gradle.write_text(s)
          else:
              gradle = Path('android/app/build.gradle')
              if gradle.exists():
                  s = gradle.read_text()
                  s = s.replace('applicationId "com.ghostlp.ghostlp"', 'applicationId "com.ghostlp.app"')
                  gradle.write_text(s)
          PY

          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_ghost_launcher.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#AB9FF2" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#17151F" android:pathData="M24,78L24,42C24,25 35,16 54,16C73,16 84,25 84,42L84,78C76,76 71,69 65,76C59,84 49,84 43,76C37,69 32,76 24,78Z"/>
              <path android:fillColor="#AB9FF2" android:pathData="M37,41A6,7 0,1 0,37,55A6,7 0,1 0,37,41Z"/>
              <path android:fillColor="#AB9FF2" android:pathData="M71,41A6,7 0,1 0,71,55A6,7 0,1 0,71,41Z"/>
          </vector>
          XML

          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text().replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/ic_ghost_launcher"')
          p.write_text(s)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Verify Dart source
        run: flutter analyze lib || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Publish GhostLP APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ghostlp-build-${{ github.run_number }}
          name: GhostLP build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
