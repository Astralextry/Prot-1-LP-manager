name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -o "*.zip" && ls GhostLP
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Force newer compileSdk for all plugins
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/sdk.gradle <<'EOF2'
          allprojects {
            afterEvaluate { p ->
              if (p.hasProperty('android')) {
                p.android.compileSdkVersion 36
              }
            }
          }
          EOF2
      - name: Prepare Android project
        working-directory: lp_manager
        run: |
          flutter create . --platforms=android --org com.example
          flutter pub get
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <queries><package android:name="app.phantom"/><package android:name="com.solflare.mobile"/></queries>\n    <application#' $M
          sed -i -E 's/minSdk(Version)?[ =]+flutter\.minSdkVersion/minSdk = 23/' android/app/build.gradle* || true
      - name: Build release APK
        working-directory: lp_manager
        run: flutter build apk --release
      - name: Publish APK as a download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LP Manager build ${{ github.run_number }}
          files: lp_manager/build/app/outputs/flutter-apk/app-release.apk
