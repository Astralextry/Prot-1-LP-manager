name: Build GhostLP APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract GhostLP
        run: |
          unzip -o GhostLP_real_backend.zip
          echo "Extracted files:"
          ls -la
          echo "Backend:"
          ls -la backend

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare GhostLP
        working-directory: backend
        run: |
          flutter create . --platforms=android --org com.ghostlp
          flutter pub get

      - name: Build GhostLP APK
        working-directory: backend
        run: |
          flutter build apk --release

      - name: Publish GhostLP APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ghostlp-build-${{ github.run_number }}
          name: GhostLP build ${{ github.run_number }}
          files: backend/build/app/outputs/flutter-apk/app-release.apk
