name: Build GhostLP APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract GhostLP
        run: |
          unzip -o GhostLP_real_backend.zip
          echo "Project contents:"
          ls -la
          test -f pubspec.yaml
          test -d lib

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Check Android project
        run: |
          if [ ! -d "android" ]; then
            echo "Android folder is missing. Creating Android platform..."
            flutter create --platforms=android .
          else
            echo "Existing Android project found. Keeping it."
          fi

      - name: Fix Flutter compatibility
        run: |
          find lib -type f -name "*.dart" -exec sed -i \
            's/Colors\.white35/Colors.white.withOpacity(0.35)/g' {} +

          find lib -type f -name "*.dart" -exec sed -i \
            's/uri: Config\.appUri/uri: Uri.parse(Config.appUri)/g' {} +

      - name: Set app name
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")

          if p.exists():
              s = p.read_text()
              s = s.replace(
                  'android:label="Flutter Demo"',
                  'android:label="GhostLP"'
              )
              s = s.replace(
                  'android:label="${applicationName}"',
                  'android:label="GhostLP"'
              )
              p.write_text(s)
          else:
              print("AndroidManifest.xml not found")
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Build GhostLP
        run: flutter build apk --release

      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ghostlp-build-${{ github.run_number }}
          name: GhostLP build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
